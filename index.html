<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Nomad — Search without the noise</title>
  <style>
    :root{color-scheme:dark;--paper:#07111f;--ink:#eaf2ff;--muted:#91a4bb;--green:#6caeff;--blue:#4b9bff;--line:#203b5a;--serif:Georgia,'Times New Roman',serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh}
    header{height:76px;padding:0 clamp(22px,6vw,88px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{font-family:var(--serif);font-size:25px;font-weight:700;letter-spacing:-1.2px;color:var(--ink);text-decoration:none;border:1px solid var(--blue);border-radius:8px;padding:4px 11px;box-shadow:0 0 18px #287be522}.brand span{color:var(--blue)}.tag{font-size:12px;color:var(--muted);letter-spacing:.11em;text-transform:uppercase}
    main{max-width:900px;margin:0 auto;padding:clamp(68px,12vh,132px) 24px 80px}.hero{text-align:center;margin-bottom:38px}.eyebrow{color:var(--green);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(48px,8vw,84px);letter-spacing:-.055em;line-height:.98;margin:18px 0 15px}.hero p{font-size:15px;line-height:1.6;color:var(--muted);margin:0}
    form{display:flex;gap:8px;padding:7px;background:#0d1a2b;border:1px solid var(--blue);border-radius:9px;box-shadow:0 12px 36px #0005;max-width:730px;margin:0 auto}input{flex:1;min-width:0;border:0;outline:0;padding:13px 14px;background:transparent;font:16px var(--sans);color:var(--ink)}input::placeholder{color:#71849a}button{border:0;border-radius:6px;background:#1762aa;color:white;padding:0 23px;font:600 14px var(--sans);cursor:pointer;transition:background .15s}button:hover{background:#247bd0}button:disabled{opacity:.65;cursor:wait}
    .meta{max-width:730px;margin:22px auto 0;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.status{max-width:730px;margin:28px auto 0;color:var(--muted);font-size:14px;text-align:center}.results{max-width:730px;margin:34px auto 0}.result{padding:19px 0 21px;border-bottom:1px solid var(--line)}.result a{color:var(--green);text-decoration:none}.result a:hover{text-decoration:underline}.result h2{font-size:19px;line-height:1.35;font-weight:550;margin:0 0 6px}.url{font-size:12px;color:#8095ac;overflow-wrap:anywhere;margin-bottom:7px}.snippet{font-size:14px;line-height:1.6;color:#b1c0d2;margin:0}.empty{padding:34px 0;text-align:center;color:var(--muted);font-size:14px}
    .viewer{position:fixed;inset:0;z-index:10;max-width:none;margin:0;background:var(--paper)}.viewer-bar{height:54px;display:flex;align-items:center;gap:14px;padding:7px 14px;border-bottom:1px solid var(--line);font-size:13px;background:#07111f}.viewer-bar button{min-height:38px;white-space:nowrap}.viewer-bar>a{color:var(--green);white-space:nowrap}.viewer-url{flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.viewer-note{display:none}#proxy-mount iframe{position:absolute;inset:54px 0 0;width:100%;height:calc(100% - 54px);border:0;border-radius:0;background:#0d1a2b}
    footer{max-width:730px;margin:60px auto 0;border-top:1px solid var(--line);padding-top:17px;display:flex;justify-content:space-between;gap:16px;color:#8193a7;font-size:11px;line-height:1.5}
    @media(max-width:540px){header{height:64px}.tag{font-size:10px}main{padding-top:70px}form{gap:3px}input{padding:12px 9px;font-size:14px}button{padding:0 15px}.meta{font-size:11px}footer{flex-direction:column;gap:4px}}
  </style>
</head>
<body>
  <header><a class="brand" href="/">no<span>mad</span></a><div class="tag">The open web, in view</div></header>
  <main>
    <div id="search-ui">
    <section class="hero"><div class="eyebrow">Search on your terms</div><h1>Go where curiosity goes.</h1><p>One query. Live web results. No wiki.</p></section>
    <form id="search-form" role="search"><input id="query" name="q" type="search" placeholder="What are you looking for?" autocomplete="off" aria-label="Search the web"><button id="submit" type="submit">Search <span aria-hidden="true">↗</span></button></form>
    <div class="meta"><span id="count">Search the web</span><span>Live web results</span></div>
    <div id="status" class="status" aria-live="polite">Enter a query to get started.</div><section id="results" class="results" aria-label="Search results"></section>
    <footer><span>Nomad retrieves live results from web search providers.</span><span>Wiki domains are excluded.</span></footer>
    </div>
    <section id="viewer" class="viewer" hidden aria-label="Website viewer">
      <div class="viewer-bar"><button id="back-results" type="button">← Back to results</button><span id="viewer-url" class="viewer-url"></span><a id="open-original" target="_blank" rel="noopener noreferrer">Open original ↗</a></div>
      <p class="viewer-note">Nomad secure viewer</p>
      <div id="proxy-mount" aria-label="Proxied website"></div>
    </section>
  </main>
  <script src="/scram/scramjet.all.js"></script>
  <script src="/baremux/index.js"></script>
  <script src="/register-sw.js" defer></script>
  <script src="/nomad.js" defer></script>
</body>
</html>
