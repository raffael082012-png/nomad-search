<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Nomad — Search without the noise</title>
  <style>
    :root{color-scheme:dark;--paper:#060912;--surface:rgba(11,17,31,.78);--ink:#f1f5ff;--muted:#93a1ba;--blue:#55a9ff;--line:rgba(128,164,214,.17);--sans:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
    *{box-sizing:border-box}html{min-height:100%;background:var(--paper)}body{position:relative;isolation:isolate;margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 28%,rgba(20,58,112,.25),transparent 48%),radial-gradient(ellipse at 4% 80%,rgba(22,66,132,.12),transparent 38%),var(--paper);color:var(--ink);font-family:var(--sans)}
    #particles{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none;opacity:.74}
    header{position:relative;z-index:1;height:76px;padding:0 clamp(22px,6vw,88px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(5,9,18,.35);backdrop-filter:blur(14px)}
    .brand{font-size:22px;font-weight:750;letter-spacing:-1.2px;color:var(--ink);text-decoration:none;border:1px solid rgba(85,169,255,.55);border-radius:11px;padding:6px 12px;box-shadow:0 0 28px rgba(40,123,229,.12);background:rgba(13,25,44,.55)}.brand span{color:var(--blue)}.tag{font-size:11px;color:#aab8ce;letter-spacing:.14em;text-transform:uppercase}
    main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:clamp(75px,13vh,145px) 24px 80px}#search-ui{animation:arrive .65s cubic-bezier(.2,.75,.25,1) both}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.hero{text-align:center;margin-bottom:42px}.hero h1{max-width:850px;margin:0 auto;font-size:clamp(76px,14vw,144px);font-weight:800;letter-spacing:-.09em;line-height:.98;color:#83c5ff;text-shadow:0 0 18px rgba(54,158,255,.72),0 0 52px rgba(24,111,233,.58),0 0 110px rgba(18,91,210,.36)}
    form{display:flex;padding:8px;background:var(--surface);border:1px solid rgba(87,158,238,.45);border-radius:15px;box-shadow:0 24px 80px rgba(0,0,0,.38),0 0 48px rgba(41,127,223,.08);backdrop-filter:blur(18px);max-width:760px;margin:0 auto;transition:border-color .2s,box-shadow .2s}form:focus-within{border-color:rgba(99,180,255,.9);box-shadow:0 24px 80px rgba(0,0,0,.38),0 0 0 4px rgba(66,148,235,.11),0 0 54px rgba(41,127,223,.15)}input{flex:1;min-width:0;border:0;outline:0;padding:14px 16px;background:transparent;font:16px var(--sans);color:var(--ink)}input::placeholder{color:#7888a3}button{border:1px solid rgba(255,255,255,.11);border-radius:10px;background:linear-gradient(135deg,#2582db,#1761ae);color:white;padding:0 23px;font:650 14px var(--sans);cursor:pointer;transition:transform .18s,filter .18s,background .18s}button:hover{filter:brightness(1.14);transform:translateY(-1px)}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #83c3ff;outline-offset:3px}button:disabled{opacity:.65;cursor:wait;transform:none}
    .meta{max-width:760px;margin:20px auto 0;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.status{max-width:760px;margin:30px auto 0;color:var(--muted);font-size:14px;text-align:center}.results{max-width:760px;margin:34px auto 0}.result{padding:20px 20px 21px;margin:0 0 10px;border:1px solid transparent;border-radius:13px;transition:background .2s,border-color .2s,transform .2s}.result:hover{background:rgba(18,29,48,.58);border-color:var(--line);transform:translateY(-1px)}.result a{color:#8bc5ff;text-decoration:none}.result a:hover{text-decoration:underline}.result h2{font-size:19px;line-height:1.35;font-weight:630;margin:0 0 6px}.url{font-size:12px;color:#8192ac;overflow-wrap:anywhere;margin-bottom:7px}.snippet{font-size:14px;line-height:1.65;color:#b6c2d4;margin:0}.empty{padding:34px 0;text-align:center;color:var(--muted);font-size:14px}
    footer{max-width:760px;margin:55px auto 0;border-top:1px solid var(--line);padding-top:17px;display:flex;justify-content:space-between;gap:16px;color:#8193a7;font-size:11px;line-height:1.5}
    .viewer{position:fixed;inset:0;z-index:10;max-width:none;margin:0;padding:0;background:var(--paper)}.viewer:fullscreen{width:100vw;height:100vh;inset:0}.viewer-bar{height:54px;display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line);font-size:13px;background:rgba(6,10,19,.96)}.viewer-bar button{min-height:38px;white-space:nowrap}.viewer-bar>a{color:#8bc5ff;white-space:nowrap;text-decoration:none}.viewer-bar>a:hover{text-decoration:underline}.viewer-url{flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.viewer-note{display:none}#proxy-mount iframe{position:absolute;inset:54px 0 0;width:100%;height:calc(100% - 54px);border:0;border-radius:0;background:#0d1a2b}
    @media(max-width:540px){header{height:64px}.tag{font-size:9px;letter-spacing:.1em}main{padding-top:78px}form{gap:4px;padding:6px}input{padding:12px 9px;font-size:14px}button{padding:0 15px}.meta{font-size:11px}footer{flex-direction:column;gap:4px}.viewer-bar{gap:6px;padding:6px 8px;font-size:11px}.viewer-bar button{padding:0 10px;min-height:36px}.viewer-bar>a{font-size:10px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <header><a class="brand" href="/">no<span>mad</span></a><div class="tag">The open web, in view</div></header>
  <main>
    <div id="search-ui">
    <section class="hero"><h1>nomad</h1></section>
    <form id="search-form" role="search"><input id="query" name="q" type="search" placeholder="What are you looking for?" autocomplete="off" aria-label="Search the web"><button id="submit" type="submit" hidden>Search</button></form>
    <div class="meta"><span id="count">Search the web</span><span>Live web results</span></div>
    <div id="status" class="status" aria-live="polite">Enter a query to get started.</div><section id="results" class="results" aria-label="Search results"></section>
    <footer><span>Nomad retrieves live results from web search providers.</span><span>Wiki domains are excluded.</span></footer>
    </div>
    <section id="viewer" class="viewer" hidden aria-label="Website viewer">
      <div class="viewer-bar"><button id="back-results" type="button">← Back to results</button><span id="viewer-url" class="viewer-url"></span><button id="fullscreen-viewer" type="button" title="Enter fullscreen" aria-label="Enter fullscreen">⛶ Fullscreen</button><a id="open-original" target="_blank" rel="noopener noreferrer">Open original ↗</a></div>
      <p class="viewer-note">Nomad secure viewer</p>

      <div id="proxy-mount" aria-label="Proxied website"></div>
    </section>
  </main>
  <script src="/scram/scramjet.all.js"></script>
  <script src="/baremux/index.js"></script>
  <script src="/register-sw.js" defer></script>
  <script src="/nomad.js" defer></script>
</body>
</html>
